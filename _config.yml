# ---------------------------------------------------------------------------
# Configuração técnica do site.
# Normalmente só é preciso mexer aqui UMA vez, na primeira publicação
# (ver README.md, secção "Primeira publicação").
# O conteúdo (percursos, UCs, coordenação) está na pasta _data/.
# ---------------------------------------------------------------------------

title: "MEFT · Percursos curriculares"

# Endereço onde o site fica publicado.
#   Repositório "tracks" na organização "coordenacao-meft"  ->  https://coordenacao-meft.github.io/tracks/
#   url     = "https://coordenacao-meft.github.io"
#   baseurl = "/tracks"        (nome do repositório, com "/" antes)
# Se o repositório se chamar "<organizacao>.github.io", use baseurl: ""
url: "https://coordenacao-meft.github.io"
baseurl: "/tracks"

# Endereço do repositório no GitHub (usado nas ligações "Editar no GitHub").
# Deixe vazio ("") para esconder essas ligações.
repository_url: "https://github.com/coordenacao-meft/tracks"
repository_branch: "main"

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
