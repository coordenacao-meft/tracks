intro:
  pt: "A área científica de Física dos Plasmas, Lasers e Fusão Nuclear oferece formação avançada e oportunidades de desenvolvimento de projetos de tese e de investigação em várias áreas de fronteira, abrangendo temas atuais como fusão nuclear e tecnologias energéticas, plasmas de baixa temperatura e tecnologias de processamento de materiais, física computacional e aprendizagem automática, aceleradores a plasma, óptica avançada, e plasmas do espaço e de astrofísica."
  en: "The Plasma Physics, Lasers and Nuclear Fusion scientific area offers advanced training and opportunities for thesis and research projects in several frontier fields, covering current topics such as nuclear fusion and energy technologies, low-temperature plasmas and materials processing technologies, computational physics and machine learning, plasma accelerators, advanced optics, and space and astrophysical plasmas."

