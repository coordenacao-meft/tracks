# ---------------------------------------------------------------------------
# CATÁLOGO DE UCs — cada UC aparece aqui UMA vez.
# Os percursos (_data/areas/*.yml) referem-se às UCs pelo identificador
# (a palavra antes dos dois pontos, ex.: "ftp").
#
# Campos:
#   name:        nome oficial (como no Fénix) em pt e en
#   ects:        créditos
#   period:      P1, P2, P3, P4 (UCs de um período) ou S1, S2 (UCs semestrais)
#   fenix:       ligação para a página da UC no plano curricular do Fénix
#   not_offered: anos letivos em que a UC NÃO funciona (ex.: ["2026/2027"])
#
# No início de cada ano letivo: confirmar períodos e "not_offered" com o
# plano curricular no Fénix (https://fenix.tecnico.ulisboa.pt/cursos/meft21/curriculo).
# Fonte destes dados: plano curricular MEFT21 no Fénix, consultado em novembro de 2026.
# Nomes em inglês: tradução provisória, a confirmar.
# ---------------------------------------------------------------------------

